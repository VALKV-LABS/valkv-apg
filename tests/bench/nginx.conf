# A deliberately fast upstream: a fixed small answer, keep-alive, no logging.
worker_processes auto;
events { worker_connections 8192; }
http {
  access_log off;
  keepalive_requests 1000000;
  server {
    listen 8080 reuseport;
    location / {
      default_type application/json;
      return 200 '{"ok":true}';
    }
  }
}
