name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Clippy, warnings denied
        run: make lint-rust

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Rust unit tests
        run: make unit-rust
      - name: Admin type-check, unit tests and shared fixtures
        run: make unit-admin
      - name: CLI type-check and unit tests
        run: make unit-cli
      - name: Console type-check and component tests
        run: make unit-ui

  e2e-file:
    name: end to end, standalone node
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: make e2e MODE=file
      - name: Binary upgrade without a dropped request
        run: make build e2e-upgrade

  packaging:
    name: Helm chart and Terraform reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make lint-helm
      - run: make lint-terraform

  integ:
    name: integration and end to end, control plane
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: make up
      - run: make integ
      - run: make e2e-resilience
      - name: Tenant isolation, egress guard, no secret in any log
        run: make e2e-security
      - name: Version skew
        run: make e2e-skew
      - name: Smoke test
        run: make smoke
      - name: Canary rehearsal
        run: make canary-rehearsal
      - if: failure()
        run: docker compose -f deploy/compose/database.yml -p valkv-apg logs --no-color --tail=200
      - if: always()
        run: make down
