# Additions to standalone.yml for the end-to-end suites (`make e2e MODE=file`):
# a test ACME authority, and the settings that point the node at it.
services:
  node:
    environment:
      APG_ACME_EMAIL: dev@valkv-apg.test
      APG_ACME_DIRECTORY_URL: https://pebble:14000/dir
      APG_ACME_INSECURE_DIRECTORY: "true"
      APG_ALLOW_TEST_MODES: "true"
      # Usage goes to a file the test runner can read, in short windows.
      APG_USAGE_FLUSH_INTERVAL_SECS: "5"
      APG_USAGE_SINK: file:/usage-out/usage
    volumes:
      - usage-out:/usage-out
    networks:
      default:
        # The name the test authority resolves when it validates a challenge.
        aliases: [acme-one.test]
    depends_on:
      pebble:
        condition: service_started
      usage-init:
        condition: service_completed_successfully

  # Makes the usage volume writable by the node's unprivileged user.
  usage-init:
    image: alpine:3
    volumes:
      - usage-out:/usage-out
    command: ["sh", "-c", "chmod 777 /usage-out"]

  e2e:
    volumes:
      - usage-out:/usage-out:ro

  node-redirect:
    environment:
      APG_TLS_MIN_VERSION: "1.3"

  # A test ACME authority (not for production use). It validates HTTP-01
  # challenges on the node's HTTP port.
  pebble:
    image: valkv-apg-pebble:dev
    build:
      context: ./pebble
    profiles: ["test"]
    environment:
      PEBBLE_VA_NOSLEEP: "1"

volumes:
  usage-out:
